{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h2 class="mb-4">Settings</h2>

<div class="card bg-dark border-secondary">
    <div class="card-body">
        <h5 class="card-title">Change Password</h5>
        <form method="POST">
            <div class="mb-3">
                <label for="current_password" class="form-label">Current Password</label>
                <input type="password" class="form-control bg-dark text-light border-secondary" id="current_password" name="current_password" required>
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" class="form-control bg-dark text-light border-secondary" id="new_password" name="new_password" required minlength="4">
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control bg-dark text-light border-secondary" id="confirm_password" name="confirm_password" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>
</div>

<div class="card bg-dark border-secondary mt-4">
    <div class="card-body">
        <h5 class="card-title">Info</h5>
        <p class="text-muted mb-1">Data is stored locally in <code>data/tracker.db</code> (SQLite).</p>
        <p class="text-muted mb-0">Use <a href="{{ url_for('history') }}">History</a> to export CSV or JSON.</p>
    </div>
</div>
{% endblock %}
