{% extends "base.html" %}
{% block title %}Edit Entry{% endblock %}
{% block content %}
<h2 class="mb-4">Edit Time Entry</h2>

<div class="card bg-dark border-secondary">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="project_id" class="form-label">Project</label>
                <select class="form-select bg-dark text-light border-secondary" id="project_id" name="project_id" required>
                    {% for project in projects %}
                    <option value="{{ project.id }}" {% if project.id == entry.project_id %}selected{% endif %}>{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control bg-dark text-light border-secondary" id="description" name="description" rows="2">{{ entry.description }}</textarea>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label for="start_time" class="form-label">Start Time</label>
                    <input type="datetime-local" class="form-control bg-dark text-light border-secondary" id="start_time" name="start_time" value="{{ entry.start_time.strftime('%Y-%m-%dT%H:%M') }}">
                </div>
                <div class="col">
                    <label for="end_time" class="form-label">End Time</label>
                    <input type="datetime-local" class="form-control bg-dark text-light border-secondary" id="end_time" name="end_time" value="{{ entry.end_time.strftime('%Y-%m-%dT%H:%M') if entry.end_time else '' }}">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
