{% extends "base.html" %}
{% block title %}AMEB Invoice{% endblock %}
{% block content %}
<h2 class="mb-4">AMEB — Invoice</h2>

<div class="card bg-dark border-secondary mb-4">
    <div class="card-body">
        <form method="GET">
            <div class="mb-4">
                <label class="form-label">Project</label>
                <select class="form-select bg-dark text-light border-secondary" name="project_id" onchange="this.form.submit()" required>
                    <option value="">— Select an AMEB project —</option>
                    {% for project in projects %}
                    <option value="{{ project.id }}" {% if selected_project and project.id == selected_project.id %}selected{% endif %}>{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>
</div>

{% if selected_project %}
<div class="card bg-dark border-secondary">
    <div class="card-body">
        <p class="text-muted mb-3">Enter timetable entries in <strong>Settings</strong> → AMEB Timetable Entry, then come here to generate the invoice.</p>
        <div class="d-flex gap-2">
            <a href="{{ url_for('settings') }}" class="btn btn-primary">Go to Settings</a>
            <form method="POST" action="{{ url_for('ameb_invoice', project_id=selected_project.id) }}">
                <button type="submit" class="btn btn-success">Generate Invoice</button>
            </form>
        </div>
    </div>
</div>
{% endif %}
{% endblock %}
