{% extends "base.html" %}
{% block title %}Outputs{% endblock %}
{% block content %}
<h2 class="mb-4">Outputs</h2>

<div class="card bg-dark border-secondary">
    <div class="card-body">
        <p class="text-muted mb-3">Select a project and date range to generate the appropriate output:</p>
        <ul class="text-muted small mb-4">
            <li><strong>ADB</strong> projects → Rolling accrual report (hours roll across days)</li>
            <li><strong>QBCC</strong> projects → Invoice (per-day rounding)</li>
        </ul>
        <form method="POST" class="row g-2 align-items-end">
            <div class="col-md-4">
                <label for="project_id" class="form-label">Project</label>
                <select class="form-select bg-dark text-light border-secondary" id="project_id" name="project_id" required>
                    <option value="">— Select a project —</option>
                    {% set adb_projects = projects | selectattr("pipeline", "equalto", "ADB") | list %}
                    {% set qbcc_projects = projects | selectattr("pipeline", "equalto", "QBCC") | list %}
                    {% if adb_projects %}
                    <optgroup label="ADB — Rolling Report">
                        {% for p in adb_projects %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                    {% if qbcc_projects %}
                    <optgroup label="QBCC — Invoice">
                        {% for p in qbcc_projects %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                </select>
            </div>
            <div class="col">
                <label for="start" class="form-label">From</label>
                <input type="date" class="form-control bg-dark text-light border-secondary" id="start" name="start">
            </div>
            <div class="col">
                <label for="end" class="form-label">To</label>
                <input type="date" class="form-control bg-dark text-light border-secondary" id="end" name="end">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Generate</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
